name: DevGuard AI

on:
  push:
    paths:
      - "projects/devguard-ai/**"
  pull_request:
    paths:
      - "projects/devguard-ai/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/devguard-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m devguard scan examples/sample.log
