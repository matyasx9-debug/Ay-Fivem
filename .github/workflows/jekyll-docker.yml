name: AY Panel CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          test -f devpanel/fxmanifest.lua
          test -f devpanel/config.lua
          test -f devpanel/client.lua
          test -f devpanel/server.lua
          test -f devpanel/html/index.html
          test -f devpanel/html/app.js
          test -f devpanel/html/style.css

      - name: Lua syntax
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src lua:5.4             sh -c 'luac -p devpanel/config.lua && luac -p devpanel/client.lua && luac -p devpanel/server.lua'

      - name: JavaScript syntax
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src node:22-alpine             node --check devpanel/html/app.js

      - name: HTML smoke check
        shell: bash
        run: |
          grep -q 'app.js' devpanel/html/index.html
          grep -q 'style.css' devpanel/html/index.html
