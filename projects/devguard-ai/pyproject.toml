[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devguard-ai"
version = "0.1.0"
description = "AI-assisted IT incident triage from the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "matyasx9-debug"}]
dependencies = []

[project.scripts]
devguard = "devguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
